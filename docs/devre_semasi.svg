<text x="935" y="488" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">90° limit switch</text>
<rect x="1000" y="215" width="230" height="200" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="1012" y="240" font-size="13" text-anchor="start" font-weight="bold" fill="#222">Limit switch'ler</text>
<text x="1012" y="262" font-size="12" text-anchor="start" font-weight="normal" fill="#222">NO kontak: bir ucu GPIO,</text>
<text x="1012" y="281" font-size="12" text-anchor="start" font-weight="normal" fill="#222">diğer ucu GND.</text>
<text x="1012" y="300" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Dahili pull-up kullanılır,</text>
<text x="1012" y="319" font-size="12" text-anchor="start" font-weight="normal" fill="#222">direnç gerekmez.</text>
<text x="1012" y="338" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Basılıyken pin LOW.</text>
<text x="1012" y="357" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Panodaki switch'lerin</text>
<text x="1012" y="376" font-size="12" text-anchor="start" font-weight="normal" fill="#222">yanına AYRI switch takılır;</text>
<text x="1012" y="395" font-size="12" text-anchor="start" font-weight="normal" fill="#222">pano kontağı kullanılmaz.</text>
<rect x="830" y="560" width="400" height="215" rx="10" fill="#faf5fc" stroke="#6a1b9a" stroke-width="2"/>
<text x="845" y="586" font-size="14" text-anchor="start" font-weight="bold" fill="#6a1b9a">Röle → motor panosu (elektrikçi)</text>
<text x="845" y="612" font-size="12" text-anchor="start" font-weight="normal" fill="#222">K1: röle 1 COM–NO → pano 'döndür' (saat tersi)</text>
<text x="845" y="632" font-size="12" text-anchor="start" font-weight="normal" fill="#222">K2: röle 2 COM–NO → pano 'home' (saat yönü)</text>
<text x="845" y="652" font-size="12" text-anchor="start" font-weight="normal" fill="#222">• Sadece NO kontak; NC kullanılmaz.</text>
<text x="845" y="672" font-size="12" text-anchor="start" font-weight="normal" fill="#222">• Mühürleme YOK: motor yalnız röle</text>
<text x="857" y="692" font-size="12" text-anchor="start" font-weight="normal" fill="#222">kapalıyken döner, açılınca durur.</text>
<text x="845" y="712" font-size="12" text-anchor="start" font-weight="normal" fill="#222">• Panoda yön kilitlemesi olmalı.</text>
<text x="845" y="732" font-size="12" text-anchor="start" font-weight="normal" fill="#222">• Motor akımı röleden GEÇMEZ.</text>
<text x="845" y="752" font-size="12" text-anchor="start" font-weight="normal" fill="#222">• 5V adaptörün GND'si Pi'ye bağlanmaz.</text>
<rect x="40" y="660" width="760" height="215" rx="10" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
<text x="56" y="688" font-size="15" text-anchor="start" font-weight="bold" fill="#222">Notlar</text>
<text x="56" y="714" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• Pi 5'i resmi 27 W USB-C adaptörle besleyin.</text>
<text x="56" y="734" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• Röle modülü: VCC → Pi 3.3V, IN1/IN2 → GPIO2/GPIO3; modülün giriş tarafı GND'si bağlanmaz.</text>
<text x="68" y="754" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">JD-VCC ve güç tarafı GND → ayrı 5V adaptör (optokuplör yalıtımı korunur).</text>
<text x="56" y="774" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• GPIO2/3'te kart üzerinde pull-up var: açılışta ve program kapalıyken röleler bırakık.</text>
<text x="56" y="794" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• KY-022'yi 3.3V'a bağlayın. config.txt: dtoverlay=gpio-ir,gpio_pin=23 (boşluksuz)</text>
<text x="56" y="814" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• Buzzer 5V ise araya NPN transistör (ör. 2N2222) gerekir.</text>
<text x="56" y="834" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• Kumandadaki * yazılımsaldır; panoda Pi'den bağımsız fiziksel acil stop şart.</text>
<text x="56" y="854" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• Pano (12–24V / 220V) tarafı asla doğrudan Pi'ye bağlanmaz.</text>
