<text x="975" y="298" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Pi'nin dahili pull-up'ı kullanılır;</text>
<text x="975" y="318" font-size="12" text-anchor="start" font-weight="normal" fill="#222">direnç gerekmez. Basılıyken pin LOW.</text>
<text x="975" y="338" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Panodaki kontağı kullanmayın.</text>
<rect x="830" y="640" width="400" height="150" rx="10" fill="#fafafa" stroke="#888888" stroke-width="2" stroke-dasharray="8,6"/>
<text x="845" y="668" font-size="13" text-anchor="start" font-weight="bold" fill="#666">PLANLANAN (kodda henüz yok)</text>
<text x="845" y="692" font-size="13" text-anchor="start" font-weight="bold" fill="#444">2 kanallı optokuplörlü röle modülü</text>
<text x="845" y="714" font-size="12" text-anchor="start" font-weight="normal" fill="#444">IN1 → GPIO5 (pin 29): döndür</text>
<text x="845" y="734" font-size="12" text-anchor="start" font-weight="normal" fill="#444">IN2 → GPIO6 (pin 31): home</text>
<text x="845" y="754" font-size="12" text-anchor="start" font-weight="normal" fill="#444">VCC → 5V, GND → GND</text>
<text x="845" y="774" font-size="12" text-anchor="start" font-weight="normal" fill="#444">Röle kontakları → motor panosu (elektrikçi)</text>
<rect x="40" y="660" width="760" height="200" rx="10" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
<text x="56" y="688" font-size="15" text-anchor="start" font-weight="bold" fill="#222">Notlar</text>
<text x="56" y="714" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• Tüm GND'ler ortak. Pi 5'i resmi 27 W USB-C adaptörle besleyin.</text>
<text x="56" y="735" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• KY-022'yi 3.3V'a bağlayın (5V değil). /boot/firmware/config.txt: dtoverlay=gpio-ir,gpio_pin=23</text>
<text x="56" y="756" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• Buzzer 5V ise doğrudan GPIO'ya bağlanmaz; araya NPN transistör (ör. 2N2222) gerekir.</text>
<text x="56" y="777" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• Panodaki home switch'i Pi'ye bağlanmaz; 90° için ayrı bir limit switch kullanılır.</text>
<text x="56" y="798" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• Kumandadaki * yazılımsal durdurmadır; motor gücünü Pi'den bağımsız kesen</text>
<text x="68" y="819" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">fiziksel acil stop butonu panoda mutlaka olmalı.</text>
<text x="56" y="840" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">• Pano (12–24V / 220V) tarafı asla doğrudan Pi'ye bağlanmaz.</text>
